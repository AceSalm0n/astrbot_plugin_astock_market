name: astrbot_plugin_astock_market
display_name: A股大盘数据
desc: 查询 A 股五大指数行情，支持异动提醒、午间小结、收盘复盘、日 K 线及 LLM 解读。
version: 1.3.1
author: AceSalm0n
repo: https://github.com/AceSalm0n/astrbot_plugin_astock_market
homepage: https://github.com/AceSalm0n/astrbot_plugin_astock_market
tags:
  - a股
  - 股票
  - 大盘
  - 行情
  - 指数
help:
  /大盘 - 获取五大指数实时行情
  /大盘分析 - 获取行情 + LLM 智能解读
  /大盘速报 - 仅获取行情，不含 LLM
  /大盘状态 - 查看插件推送配置状态
  /大盘提供商 - 查看可用 LLM 提供商列表（也可在 WebUI 插件配置中直接选择）
  /午间小结 - 查看当天上午行情摘要
  /收盘复盘 - 查看最近已完成交易日复盘
  /大盘走势 [20或60] - 查看指数收盘对比图
  /指数走势 <指数> [20或60] - 查看单指数日 K 线与均线
  /上证 - 查询上证指数
  /深证 - 查询深证成指
  /创业板 - 查询创业板指
  /科创50 - 查询科创50
  /沪深300 - 查询沪深300

support_platforms:
  - aiocqhttp
